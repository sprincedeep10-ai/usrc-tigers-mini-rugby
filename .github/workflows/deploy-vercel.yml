name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger production deploy
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -n "${DEPLOY_HOOK}" ]; then
            echo "Deploying via Vercel deploy hook..."
            curl -fsS -X POST "${DEPLOY_HOOK}"
            echo "Deploy hook triggered successfully."
            exit 0
          fi

          if [ -n "${VERCEL_TOKEN}" ] && [ -n "${VERCEL_ORG_ID}" ] && [ -n "${VERCEL_PROJECT_ID}" ]; then
            echo "Deploying via Vercel CLI..."
            npm ci
            npx vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
            npx vercel build --prod --token="${VERCEL_TOKEN}"
            npx vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
            exit 0
          fi

          echo "::error::No deploy credentials found."
          echo "Add VERCEL_DEPLOY_HOOK to GitHub repo secrets (easiest),"
          echo "or add VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID."
          echo "Until then, redeploy manually: Vercel dashboard -> Deployments -> Redeploy."
          exit 1
